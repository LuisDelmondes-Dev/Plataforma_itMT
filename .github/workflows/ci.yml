name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — banco descartável + regressão completa
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS é REQUISITO desde a db/68, que traz o modelo analítico e o DW
        # com 226 colunas de geometria em SRID 4674. A imagem `postgres:16` sem
        # a extensão faria toda migração a partir da 68 falhar no CI.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: itmt
          POSTGRES_PASSWORD: itmt
          POSTGRES_DB: itmt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itmt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://itmt:itmt@localhost:5432/itmt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Fitness gate F0 — artefatos e topologia de produção
        run: node scripts/gates/f0-gate.mjs
      - name: Instalar dependências
        working-directory: api
        run: npm ci
      - name: Bloquear vulnerabilidades críticas
        working-directory: api
        run: npm audit --omit=dev --audit-level=moderate
      - name: Suíte e2e em banco isolado
        working-directory: api
        run: npm test
      - name: Provar backup e restore em bancos descartaveis
        working-directory: api
        run: npm run test:restore
      - name: Gerar SBOM CycloneDX
        working-directory: api
        run: npm sbom --omit=dev --sbom-format=cyclonedx > api-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: api-sbom
          path: api/api-sbom.cdx.json

  web:
    name: Web — build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        working-directory: web
        run: npm ci
      - name: Bloquear vulnerabilidades críticas
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build de produção
        working-directory: web
        run: npm run build
      - name: Gerar SBOM CycloneDX
        working-directory: web
        run: npm sbom --omit=dev --sbom-format=cyclonedx > web-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: web-sbom
          path: web/web-sbom.cdx.json

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL — JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
